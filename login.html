<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — FreshFare 2K26</title>
    <meta name="description" content="Secure admin login for IT Department event management.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f5ff;
            --neon-green: #39ff14;
            --neon-purple: #bf5af2;
            --neon-blue: #0a84ff;
            --neon-pink: #ff2d55;
            --bg-dark: #0a0e17;
            --bg-card: rgba(15, 22, 36, 0.85);
            --border: rgba(0, 245, 255, 0.12);
            --text: #e4eaf5;
            --text-muted: #7a8ba8;
            --gradient-cyber: linear-gradient(135deg, #00f5ff, #0a84ff, #bf5af2);
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridShift 20s linear infinite;
            z-index: 0;
        }
        @keyframes gridShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 12s ease-in-out infinite;
            z-index: 0;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: var(--neon-cyan);
            top: -100px; left: -50px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: var(--neon-purple);
            bottom: -80px; right: -30px;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: var(--neon-blue);
            top: 40%; right: 10%;
            animation-delay: -8s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 15px) scale(0.95); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px 40px;
            text-align: center;
            backdrop-filter: blur(30px);
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Top gradient line */
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: var(--gradient-cyber);
            border-radius: 2px;
        }

        /* Shield icon */
        .login-icon {
            width: 72px;
            height: 72px;
            background: rgba(0, 245, 255, 0.06);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 1.8rem;
            color: var(--neon-cyan);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 245, 255, 0); }
            50% { box-shadow: 0 0 20px 4px rgba(0, 245, 255, 0.1); }
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .login-card .subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Input field */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .input-group input {
            width: 100%;
            padding: 15px 48px 15px 44px;
            background: rgba(0, 245, 255, 0.03);
            border: 1px solid rgba(0, 245, 255, 0.1);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.08);
        }
        .input-group input:focus + .input-icon,
        .input-group input:focus ~ .input-icon {
            color: var(--neon-cyan);
        }
        .input-group input::placeholder {
            color: rgba(122, 139, 168, 0.6);
        }

        /* Toggle password visibility */
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.3s;
        }
        .toggle-pw:hover { color: var(--neon-cyan); }

        /* Error message */
        .login-error {
            color: var(--neon-pink);
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
            padding: 10px 14px;
            background: rgba(255, 45, 85, 0.06);
            border: 1px solid rgba(255, 45, 85, 0.15);
            border-radius: 8px;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* Submit button */
        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--gradient-cyber);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 245, 255, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .login-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 245, 255, 0.06);
        }
        .login-footer p {
            color: rgba(122, 139, 168, 0.5);
            font-size: 0.75rem;
            line-height: 1.6;
        }
        .login-footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .login-footer a:hover { opacity: 1; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--neon-cyan); }

        @media (max-width: 480px) {
            .login-card { padding: 36px 24px 32px; }
            .login-card h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>Admin Access</h1>
            <p class="subtitle">Enter your password to access the admin dashboard</p>

            <div class="login-error" id="loginError">
                <i class="fas fa-exclamation-circle"></i> Invalid password. Try again.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Enter admin password" autocomplete="current-password" autofocus required>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <div class="spinner"></div>
                    <span class="btn-text"><i class="fas fa-arrow-right-to-bracket"></i> Authenticate</span>
                </button>
            </form>

            <div class="login-footer">
                <p>IT Department — FreshFare 2K26<br>
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.5px;">🔒 Secured with bcrypt + session auth</span></p>
            </div>
        </div>

        <div style="text-align:center;">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to event page</a>
        </div>
    </div>

<script>
    // Check if already logged in
    fetch('/api/admin/session')
        .then(r => { if (r.ok) window.location.href = getRedirectTarget(); })
        .catch(() => {});

    function getRedirectTarget() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect === 'scanner') return '/scanner';
        return '/admin';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const pw = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');

        if (!pw) return;

        // Show loading state
        btn.classList.add('loading');
        errorEl.style.display = 'none';

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw })
            });

            if (res.ok) {
                // Success — redirect to admin or scanner
                btn.innerHTML = '<i class="fas fa-check"></i> Authenticated!';
                btn.style.background = 'linear-gradient(135deg, #39ff14, #00f5ff)';
                setTimeout(() => {
                    window.location.href = getRedirectTarget();
                }, 500);
            } else {
                // Wrong password
                btn.classList.remove('loading');
                errorEl.style.display = 'block';
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
            }
        } catch (err) {
            btn.classList.remove('loading');
            errorEl.innerHTML = '<i class="fas fa-wifi-slash"></i> Cannot connect to server. Is it running?';
            errorEl.style.display = 'block';
        }
    }

    function togglePassword() {
        const input = document.getElementById('loginPassword');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // Enter key support
    document.getElementById('loginPassword').addEventListener('keypress', e => {
        if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
    });
</script>
</body>
</html>
